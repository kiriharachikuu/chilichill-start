<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深入厚嘴唇星计划 · ChiliChill五周年同人生日会 · 专题页</title>
<!--
  ═══════════════════════════════════════════════════════════════
  专题页模板 · 深空蓝风格（配色取自活动主视觉）
  ───────────────────────────────────────────────────────────────
  使用方法：只需把下方 <script> 里的 PAGE_DATA 替换为你自己的
  活动数据（文案 / 主视觉 / 内嵌播放器 / 评论示例），其余不用动。

  运行约束（请勿破坏）：
  · 单文件自包含，所有样式与脚本都在本文件内
  · 不使用 localStorage / Cookie / 同源接口，可在沙箱 iframe 内运行
  · 外部图片/iframe 请使用完整 https:// 链接
  · 内嵌视频使用 B站官方外链播放器 player.bilibili.com

  配色来源：「深入厚嘴唇星计划」主视觉（深空蓝 + 星星黄 + 猪猪粉橙）。
  ═══════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --panel:#12235E;          /* 主面板深空蓝 */
    --panel-deep:#0C1A44;
    --cream:#FFF4DC;          /* 面板主文字（暖白） */
    --cream-dim:rgba(255,244,220,.72);
    --gold:#F7C948;           /* 星星黄点缀 */
    --salmon:#F2987E;         /* 猪猪粉橙 */
    --bg-navy:#0A173A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1B2C68;
    background:var(--bg-navy);
  }
  img{display:block;border:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;border:0;cursor:pointer;background:none}

  /* ── Hero 主视觉横幅 ──────────────── */
  .hero{padding:18px 14px 8px}
  .hero img{width:100%;max-width:1212px;height:auto;margin:0 auto;border-radius:10px;box-shadow:0 4px 18px rgba(4,10,30,.45)}

  /* ── 主体布局 ─────────────────────── */
  .layout{max-width:1240px;margin:0 auto;padding:10px 14px 56px}

  /* 内嵌 B站播放器 */
  .player{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 3px 14px rgba(4,10,30,.4)}
  .player iframe{width:100%;height:100%;border:0;display:block}

  /* 信息面板（深空蓝底·星星黄框） */
  .panel{background:var(--panel);border-radius:8px;color:var(--cream);box-shadow:0 2px 10px rgba(4,10,30,.35);overflow:hidden}
  .panel+.panel{margin-top:12px}
  .info-panel{padding:14px 16px 16px}
  .info-head{
    border:1px solid rgba(255,226,120,.62);border-radius:6px;background:rgba(0,0,0,.07);
    box-shadow:inset 0 0 0 1px rgba(255,226,120,.18);
    padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .info-head h1{font-size:21px;font-weight:800;letter-spacing:1px;color:var(--cream)}
  .fav-btn{
    flex-shrink:0;background:linear-gradient(#FFD75E,#F2A93C);color:#1B2C68;font-weight:800;font-size:14px;
    padding:8px 20px;border-radius:6px;box-shadow:0 2px 4px rgba(4,10,30,.35);display:flex;align-items:center;gap:5px;
  }
  .fav-btn svg{width:14px;height:14px;fill:#1B2C68}
  .info-sub{font-size:12px;color:var(--cream-dim);margin-top:9px}
  .stats-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .stat{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
  .stat svg{width:18px;height:18px;fill:var(--gold)}
  .stats-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--cream-dim)}
  .badge-gold{border:1px solid rgba(255,226,120,.7);color:var(--gold);font-size:11px;padding:2px 8px;border-radius:10px}
  .meta-row{font-size:12px;color:var(--cream-dim);margin:10px 0}
  .desc{font-size:13px;line-height:1.75;color:var(--cream-dim)}
  .desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .desc-toggle{color:var(--gold);font-size:12px;margin-top:4px;display:inline-block}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;color:var(--cream-dim)}
  .tags a:hover{color:var(--gold)}
  .staff{margin-top:16px}
  .staff-label{font-size:13px;font-weight:700;margin-bottom:10px}
  .staff-list{display:flex;flex-wrap:wrap;gap:10px 18px}
  .staff-item{display:flex;align-items:center;gap:9px}
  .staff-item img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,244,220,.4)}
  .staff-item .nm{font-size:13px;color:var(--cream)}
  .staff-item .rl{font-size:11px;color:var(--salmon)}
  .staff-item .ava-fallback{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0;border:1.5px solid rgba(255,244,220,.4)}
  .follow-btn{background:linear-gradient(#FFD75E,#F2A93C);color:#1B2C68;font-size:12px;font-weight:700;padding:5px 12px;border-radius:5px}

  /* 评论区（白卡） */
  .comments{background:#fff;border-radius:8px;margin-top:12px;padding:16px;color:#222;box-shadow:0 2px 10px rgba(4,10,30,.3)}
  .c-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .c-head .n{font-size:15px;font-weight:700}
  .c-tabs{display:flex;gap:14px;font-size:13px;color:#9499A0}
  .c-tabs span{cursor:pointer;padding-bottom:3px}
  .c-tabs span.on{color:#222;font-weight:700;border-bottom:2px solid var(--salmon)}
  .c-input{display:flex;gap:10px;margin-bottom:6px}
  .c-input input{flex:1;height:38px;border:0;border-radius:8px;background:#F1F2F3;padding:0 14px;font-size:13px;outline:none}
  .c-input input::placeholder{color:#AAA}
  .c-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F1F2F3}
  .c-item:last-of-type{border-bottom:0}
  .c-ava{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
  .c-body{flex:1;min-width:0}
  .c-name{font-size:12px;color:#6D757A;display:flex;align-items:center;gap:6px}
  .c-lv{font-size:10px;color:#fff;background:#FFB027;border-radius:3px;padding:0 4px;font-weight:700}
  .c-text{font-size:13px;line-height:1.65;margin-top:3px;color:#222}
  .c-foot{display:flex;align-items:center;gap:14px;margin-top:5px;font-size:11px;color:#9499A0}
  .c-like{margin-left:auto;display:flex;align-items:center;gap:4px;color:#9499A0;cursor:pointer}
  .c-like svg{width:13px;height:13px;fill:#9499A0}
  .c-more{display:block;text-align:center;font-size:13px;color:#9499A0;padding-top:14px;cursor:pointer}
  .c-more:hover{color:var(--salmon)}

  /* ── 页脚 ─────────────────────────── */
  .foot{text-align:center;padding:26px 0 44px;font-size:12px;color:rgba(213,224,248,.55);line-height:1.9}

  /* ── 响应式 ───────────────────────── */
  @media (max-width:960px){
    .hero{padding-top:12px}
    .info-head h1{font-size:17px}
  }
  @media (max-width:520px){
    .stats-right{display:none}
    .staff-list{gap:8px}
  }
</style>
</head>

/* ── 交互 ── */
document.getElementById("descToggle").addEventListener("click", function () {
  const d = document.getElementById("desc");
  const clamped = d.classList.toggle("clamp");
  this.textContent = clamped ? "展开更多" : "收起";
});
const renderComments = key => {
  document.getElementById("cList").innerHTML = PAGE_DATA.comments[key].map(c => `
    <div class="c-item">
      <div class="c-ava" style="background:${esc(c.color)}">${esc(c.name.slice(0, 1))}</div>
      <div class="c-body">
        <div class="c-name">${esc(c.name)}<span class="c-lv">LV${esc(c.lv)}</span></div>
        <div class="c-text">${esc(c.text)}</div>
        <div class="c-foot"><span>${esc(c.time)}</span><span>IP属地：${esc(c.ip)}</span><a href="#">回复</a>
          <span class="c-like">${ICON.like}<span>${esc(c.like)}</span></span>
        </div>
      </div>
    </div>`).join("");
};
renderComments("hot");
document.getElementById("cTabs").addEventListener("click", e => {
  const t = e.target.closest("span[data-tab]");
  if (!t) return;
  document.querySelectorAll("#cTabs span").forEach(s => s.classList.toggle("on", s === t));
  renderComments(t.dataset.tab);
});
</script>
